name: build-docker-image

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  DH_USER: ilolita945

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tags
        id: prep
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha_tag=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DH_USER" --password-stdin

      - name: Build & push (Docker Hub, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DH_USER }}/tools-web:latest
            ${{ env.DH_USER }}/tools-web:${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (GHCR, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.DH_USER }}/tools-web:latest
            ghcr.io/${{ env.DH_USER }}/tools-web:${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 冒烟测试：拉取刚发布的镜像起容器，验证首页可访问 ----------
  smoke-test:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Pull & run published image
        run: |
          docker pull ${{ env.DH_USER }}/tools-web:latest
          docker run -d --name smoke -p 8080:80 ${{ env.DH_USER }}/tools-web:latest

      - name: Health check
        run: |
          ok=""
          for i in $(seq 1 30); do
            body=$(curl -s http://127.0.0.1:8080/ || true)
            if echo "$body" | grep -q 'id="app"'; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "✗ 首页未就绪"
            docker logs smoke --tail=50
            exit 1
          fi
          echo "✓ 首页 200 且含 Vue 挂载点"

      - name: Teardown
        if: always()
        run: docker rm -f smoke
